info:
  title: Reviewit Invitations API
  version: 2.0.0
  description: Πρόσκληση πελατών για κριτική από το κατάστημά σας. Δείτε τους οδηγούς για το κλειδί, το κλειδί δοκιμής και τα παραδείγματα κώδικα.
servers:
